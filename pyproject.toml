[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robinbook"
version = "0.1.0"
description = "An interactive order book simulation with autonomous trading bots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yfinance>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.0",
]

[project.scripts]
robinbook = "orderbook.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.so"]
